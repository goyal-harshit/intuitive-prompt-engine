repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend, uses project venv)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: prettier
        name: prettier (frontend, uses project node_modules)
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|css|json|md)$
        pass_filenames: false
