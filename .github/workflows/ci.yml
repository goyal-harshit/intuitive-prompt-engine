name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # OpenCV / MediaPipe link against these even in headless (import) use.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type-check)
        run: mypy

      - name: Pytest
        run: pytest

      - name: pip-audit (dependency vulnerability scan)
        if: matrix.python-version == '3.12'
        # PYSEC-2026-1805 (protobuf): only fixed in protobuf >=5.29.6, but
        # mediapipe 0.10.14 (pinned for the legacy mp.solutions API) requires
        # protobuf <5. Not exploitable here: protobuf never parses untrusted
        # input in this app. Re-evaluate when mediapipe is upgraded.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1805

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier
        working-directory: frontend
        run: npm run format:check

      - name: Type-check & build
        working-directory: frontend
        run: npm run build

      - name: Vitest
        working-directory: frontend
        run: npm test

      - name: npm audit (dependency vulnerability scan)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [quality, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: intuitive-prompt-engine-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: false
          tags: intuitive-prompt-engine-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the stack
        run: |
          docker compose up -d --build
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose ps -q backend)" 2>/dev/null || echo starting)
            echo "backend health: $status"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker compose logs backend --tail 50
          # Compose maps the API to host port 8010 by default (see .env.example).
          curl -fsS http://localhost:8010/api/health
          curl -fsS -o /dev/null -w "frontend HTTP %{http_code}\n" http://localhost:8080/
          docker compose down -v
