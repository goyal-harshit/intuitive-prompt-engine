# Serves the static SPA and reverse-proxies the API + WebSocket to the backend
# container, so the browser talks to a single origin (the frontend's default
# when the page is opened on localhost is a same-origin, relative backend URL).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets (zero-build SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The MJPEG frame stream must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # WebSocket -> backend service.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
